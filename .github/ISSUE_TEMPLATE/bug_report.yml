name: Bug report
description: Report a reproducible problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach private ChatGPT conversations or Codex session files.
  - type: dropdown
    id: extension
    attributes:
      label: Extension
      options:
        - Browser (ChatGPT)
        - VS Code (Codex)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser / VS Code / OS version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
